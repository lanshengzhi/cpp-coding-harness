name: Arch latest drift (advisory)

# Advisory drift detection (ADR 0039; issue #474): current Arch latest, built
# and tested on a weekly schedule. This lane is advisory by construction — it
# never runs on pull requests or pushes, so it cannot gate qualification and
# can never substitute for the digest-pinned blocking Arch lane in
# linux-toolchain.yml. A failure here means upstream Arch drifted away from
# the declared supported contract (toolchain floors, pinned vcpkg path,
# Parity Architecture Gate); respond by deliberately re-pinning the blocking
# lane, never by loosening it.

on:
  schedule:
    # Weekly, Tuesday 04:23 UTC.
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch-latest:
    name: Arch latest (advisory; never a qualification gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: archlinux:base-devel
    env:
      CCH_LIVE_KIMI: "0"
      VCPKG_FORCE_SYSTEM_BINARIES: "1"
      VCPKG_ROOT: ${{ github.workspace }}/.deps/vcpkg
    steps:
      - name: Install tool gaps from current Arch
        run: pacman -Syu --noconfirm --needed git zip unzip python

      - name: Report the drifted toolchain
        run: |
          gcc -dumpfullversion
          python3 --version

      - name: Check out harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out pinned vcpkg
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: microsoft/vcpkg
          ref: 2f1d605400c8727cc00c15797aba796c88ccd523
          path: .deps/vcpkg

      - name: Install pinned CMake and Ninja
        run: scripts/ci/install-build-tools.sh "$RUNNER_TEMP/cch-build-tools"

      - name: Bootstrap pinned vcpkg
        run: |
          test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "2f1d605400c8727cc00c15797aba796c88ccd523"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset vcpkg

      - name: Build
        run: cmake --build --preset vcpkg

      - name: Run offline tests
        env:
          KIMI_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: ctest --preset vcpkg --no-tests=error
