name: Supported Linux toolchain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 16 Debug
            preset: vcpkg
            cc: gcc-16
            cxx: g++-16
            compiler: gcc
            sanitizer: ""
          - name: GCC 16 Release
            preset: vcpkg-release
            cc: gcc-16
            cxx: g++-16
            compiler: gcc
            sanitizer: ""
          - name: Clang 22 conformance
            preset: clang-conformance
            cc: clang-22
            cxx: clang++-22
            compiler: clang
            sanitizer: ""
          - name: GCC 16 ASan+UBSan
            preset: vcpkg-asan-ubsan
            cc: gcc-16
            cxx: g++-16
            compiler: gcc
            sanitizer: asan-ubsan
          - name: GCC 16 TSan scenarios
            preset: vcpkg-tsan
            cc: gcc-16
            cxx: g++-16
            compiler: gcc
            sanitizer: tsan
    env:
      CCH_LIVE_KIMI: "0"
      VCPKG_FORCE_SYSTEM_BINARIES: "1"
      VCPKG_ROOT: ${{ github.workspace }}/.deps/vcpkg

    steps:
      - name: Check out harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out pinned vcpkg
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: microsoft/vcpkg
          ref: 2f1d605400c8727cc00c15797aba796c88ccd523
          path: .deps/vcpkg

      - name: Install pinned CMake and Ninja
        run: scripts/ci/install-build-tools.sh "$RUNNER_TEMP/cch-build-tools"

      - name: Install pinned GCC and libstdc++
        env:
          GCC_PACKAGE_VERSION: 16-20260315-1ubuntu1~24~ppa1
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes \
            "gcc-16=$GCC_PACKAGE_VERSION" \
            "g++-16=$GCC_PACKAGE_VERSION"
          test "$(dpkg-query --show --showformat='${Version}' gcc-16)" = "$GCC_PACKAGE_VERSION"
          test "$(dpkg-query --show --showformat='${Version}' g++-16)" = "$GCC_PACKAGE_VERSION"
          test "$(g++-16 -dumpfullversion)" = "16.0.1"

      - name: Install pinned Clang
        if: matrix.compiler == 'clang'
        env:
          CLANG_PACKAGE_VERSION: "1:22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80"
        run: |
          curl --fail --location --silent --show-error \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor --yes --output /usr/share/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes "clang-22=$CLANG_PACKAGE_VERSION"
          test "$(dpkg-query --show --showformat='${Version}' clang-22)" = "$CLANG_PACKAGE_VERSION"
          test "$(clang++-22 --version | awk 'NR == 1 { print $4 }')" = "22.1.8"
          clang++-22 -print-file-name=libstdc++.so | grep -F '/16/'

      - name: Install LLVM symbolizer
        # Sanitizer reports must be symbolized to be actionable (#473). The
        # symbolizer is a reporting tool, not a build input; its presence is
        # asserted so a missing symbolizer fails the job instead of silently
        # degrading reports to raw addresses.
        if: matrix.sanitizer != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm
          symbolizer="$(command -v llvm-symbolizer || true)"
          if [[ -z "$symbolizer" ]]; then
            symbolizer="$(ls /usr/lib/llvm-*/bin/llvm-symbolizer 2>/dev/null | head -1 || true)"
          fi
          test -n "$symbolizer" && test -x "$symbolizer"
          echo "CCH_SYMBOLIZER=$symbolizer" >> "$GITHUB_ENV"

      - name: Bootstrap pinned vcpkg
        run: |
          test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "2f1d605400c8727cc00c15797aba796c88ccd523"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Run offline tests
        if: matrix.sanitizer == ''
        env:
          KIMI_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: ctest --preset "${{ matrix.preset }}" --no-tests=error

      # Blocking sanitizer coverage (#473): the ASan+UBSan job exercises the
      # full supported test suite with symbolized, halting reports; the TSan
      # job runs the focused repeated asynchronous lifecycle scenarios. Both
      # use fake providers with blanked credentials and no network dependency.
      - name: Run ASan+UBSan suite
        if: matrix.sanitizer == 'asan-ubsan'
        env:
          KIMI_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          ASAN_SYMBOLIZER_PATH: ${{ env.CCH_SYMBOLIZER }}
          ASAN_OPTIONS: "symbolize=1:detect_leaks=1:halt_on_error=1:print_stacktrace=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: ctest --preset "${{ matrix.preset }}" --no-tests=error

      - name: Run focused TSan scenarios
        if: matrix.sanitizer == 'tsan'
        env:
          KIMI_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          TSAN_OPTIONS: "halt_on_error=1:external_symbolizer_path=${{ env.CCH_SYMBOLIZER }}"
        run: scripts/ci/tsan-scenarios.sh "${{ github.workspace }}/build/tsan"

  # Release qualification (issue #474): the GCC 16.x Release IPO/LTO artifact
  # lane. The install path itself runs the fail-closed install gate (Gate,
  # evidence freshness, dependency closure); the steps below additionally
  # audit the staged binary, smoke it after relocation under a scrubbed
  # offline environment, and verify the complete evidence directory with the
  # fail-closed verifier — missing, stale, contradictory, or incomplete
  # evidence fails the job.
  release-artifact:
    name: GCC 16 Release artifact (IPO/LTO)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCH_LIVE_KIMI: "0"
      VCPKG_FORCE_SYSTEM_BINARIES: "1"
      VCPKG_ROOT: ${{ github.workspace }}/.deps/vcpkg
    steps:
      - name: Record the qualification run start
        run: echo "RUN_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out pinned vcpkg
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: microsoft/vcpkg
          ref: 2f1d605400c8727cc00c15797aba796c88ccd523
          path: .deps/vcpkg

      - name: Install pinned CMake and Ninja
        run: scripts/ci/install-build-tools.sh "$RUNNER_TEMP/cch-build-tools"

      - name: Install pinned GCC and libstdc++
        env:
          GCC_PACKAGE_VERSION: 16-20260315-1ubuntu1~24~ppa1
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes \
            "gcc-16=$GCC_PACKAGE_VERSION" \
            "g++-16=$GCC_PACKAGE_VERSION"
          test "$(dpkg-query --show --showformat='${Version}' gcc-16)" = "$GCC_PACKAGE_VERSION"
          test "$(dpkg-query --show --showformat='${Version}' g++-16)" = "$GCC_PACKAGE_VERSION"
          test "$(g++-16 -dumpfullversion)" = "16.0.1"

      - name: Bootstrap pinned vcpkg
        run: |
          test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "2f1d605400c8727cc00c15797aba796c88ccd523"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        env:
          CC: gcc-16
          CXX: g++-16
        run: cmake --preset vcpkg-release-artifact

      - name: Build
        run: cmake --build --preset vcpkg-release-artifact

      - name: Collect toolchain and Gate evidence
        run: |
          evidence="$RUNNER_TEMP/release-evidence"
          mkdir -p "$evidence"
          build_dir="build/release-artifact"
          # -p preserves the build-phase mtime: a gate report left over from an
          # older run keeps its stale timestamp and fails REL-2001 instead of
          # being laundered into fresh-looking evidence by the copy.
          cp -p "$build_dir/parity-build-gate.json" "$evidence/parity-build-gate.json"
          python3 - "$build_dir" "$evidence/toolchain.json" <<'EOF'
          import json
          import os
          import subprocess
          import sys
          import time

          build_dir, out_path = sys.argv[1], sys.argv[2]

          def run(*args):
              return subprocess.run(args, capture_output=True, text=True, check=True).stdout.strip()

          build_type = ""
          with open(os.path.join(build_dir, "CMakeCache.txt"), encoding="utf-8") as cache:
              for line in cache:
                  if line.startswith("CMAKE_BUILD_TYPE:"):
                      build_type = line.partition("=")[2].strip()
          with open(os.path.join(build_dir, "compile_commands.json"), encoding="utf-8") as handle:
              compile_commands = handle.read()
          document = {
              "schema_version": 1,
              "recorded_at": time.time(),
              "gcc_version": run("g++-16", "-dumpfullversion"),
              "cmake_version": run("cmake", "--version").splitlines()[0].split()[-1],
              "ninja_version": run("ninja", "--version"),
              "build_type": build_type,
              "ipo_lto": "-flto" in compile_commands,
              "vcpkg_revision": run("git", "-C", os.environ["VCPKG_ROOT"], "rev-parse", "HEAD"),
          }
          with open(out_path, "w", encoding="utf-8") as out:
              json.dump(document, out, indent=2)
              out.write("\n")
          EOF
          echo "EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      - name: Install to a clean staging prefix
        run: cmake --install build/release-artifact --prefix "$RUNNER_TEMP/stage" 2>&1 | tee "$EVIDENCE_DIR/install-gate.log"

      - name: Audit the staged dependency closure
        run: |
          python3 cmake/install/audit_runtime_deps.py \
            --binary "$RUNNER_TEMP/stage/bin/cpp_harness" \
            --allowlist cmake/install/runtime-deps.json \
            --forbid-root "$PWD" \
            --forbid-root "$PWD/build/release-artifact" \
            --forbid-root "$VCPKG_ROOT/installed/x64-linux" \
            2>&1 | tee "$EVIDENCE_DIR/dependency-closure.log"

      - name: Relocation and offline smoke
        run: |
          scripts/ci/release-artifact-smoke.sh \
            "$RUNNER_TEMP/stage" \
            "$PWD/build/release-artifact/cpp_harness" \
            2>&1 | tee "$EVIDENCE_DIR/relocation-smoke.log"

      - name: Bind the evidence to the artifact digest
        run: (cd "$RUNNER_TEMP/stage" && sha256sum bin/cpp_harness) > "$EVIDENCE_DIR/artifact.sha256"

      - name: Verify release evidence (fail closed)
        run: |
          python3 scripts/ci/verify_release_evidence.py \
            --evidence-dir "$EVIDENCE_DIR" \
            --run-started-at "$RUN_STARTED_AT" \
            --vcpkg-baseline "$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')" \
            --artifact "$RUNNER_TEMP/stage/bin/cpp_harness"

      - name: Upload the qualified Runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpp_harness-runtime-linux-x86_64
          path: |
            ${{ runner.temp }}/stage
            ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 30

  # Blocking supported Arch validation lane (ADR 0039; issue #474): a
  # digest-pinned Arch base-devel snapshot running the same declared
  # dependency contract (pinned vcpkg manifest) and the same Parity
  # Architecture Gate contracts as the Ubuntu lanes. The image digest freezes
  # the environment; the pacman mirror is pinned to the matching Arch Linux
  # Archive snapshot so the installed tool gaps (git, zip, unzip) come from
  # the same frozen package set. A toolchain drift (e.g. GCC leaving 16.x)
  # fails this lane closed and forces a deliberate re-pin.
  arch-pinned:
    name: Arch pinned base-devel-20260809 (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: archlinux:base-devel@sha256:ee205c220399524a683cf495d411691b921baed8ab47cdc6d732efa782fae484 # base-devel-20260809.0.570793
    env:
      CCH_LIVE_KIMI: "0"
      VCPKG_FORCE_SYSTEM_BINARIES: "1"
      VCPKG_ROOT: ${{ github.workspace }}/.deps/vcpkg
    steps:
      - name: Pin pacman to the image snapshot and install tool gaps
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/08/09/$repo/os/$arch\n' \
            > /etc/pacman.d/mirrorlist
          pacman -Sy --noconfirm --needed git zip unzip python

      - name: Assert the declared toolchain contract
        run: |
          case "$(gcc -dumpfullversion)" in 16.*) ;; *) echo "pinned Arch GCC drifted: $(gcc -dumpfullversion)" >&2; exit 1;; esac
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 12) else 1)'

      - name: Check out harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out pinned vcpkg
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: microsoft/vcpkg
          ref: 2f1d605400c8727cc00c15797aba796c88ccd523
          path: .deps/vcpkg

      - name: Install pinned CMake and Ninja
        run: scripts/ci/install-build-tools.sh "$RUNNER_TEMP/cch-build-tools"

      - name: Bootstrap pinned vcpkg
        run: |
          test "$(git -C "$VCPKG_ROOT" rev-parse HEAD)" = "2f1d605400c8727cc00c15797aba796c88ccd523"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset vcpkg

      - name: Build
        run: cmake --build --preset vcpkg

      - name: Run offline tests
        env:
          KIMI_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: ctest --preset vcpkg --no-tests=error
